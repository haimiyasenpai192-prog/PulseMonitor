name: Build release APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q PulseMonitor.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle :app:assembleRelease --no-daemon --stacktrace
        working-directory: PulseMonitor
      - uses: actions/upload-artifact@v4
        with:
          name: PulseMonitor-release
          path: PulseMonitor/app/build/outputs/apk/release/*.apk
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-reports
          path: PulseMonitor/app/build/reports
